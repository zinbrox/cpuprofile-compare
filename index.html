<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CPU Profile Comparator</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <header>
    <h1>CPU Profile Comparator</h1>
    <p class="subtitle">Load multiple <code>.cpuprofile</code> files to compare function-level CPU time</p>
  </header>

  <main>
    <section class="drop-zone" id="dropZone">
      <div class="drop-zone__inner">
        <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 16V8m0 0l-3 3m3-3l3 3M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Drop <code>.cpuprofile</code> files here</span>
        <span class="or">or</span>
        <button class="btn" id="browseBtn">Browse files</button>
        <input type="file" id="fileInput" accept=".cpuprofile,.json" multiple hidden />
      </div>
    </section>

    <section class="chips-row" id="chipsRow" hidden>
      <div class="chips" id="chips"></div>
    </section>

    <section class="controls" id="controls" hidden>
      <div class="control-group" id="sortByGroup">
        <label for="sortBy">Sort by</label>
        <select id="sortBy">
          <option value="totalPct">Total %</option>
          <option value="selfPct">Self %</option>
          <option value="totalMs">Total ms</option>
          <option value="delta">Delta (2nd vs 1st)</option>
        </select>
      </div>
      <div class="control-group" id="filterGroup">
        <label for="filterInput">Filter</label>
        <input type="text" id="filterInput" placeholder="function or file name..." />
      </div>
      <div class="control-group" id="topNGroup">
        <label for="topN">Top</label>
        <input type="number" id="topN" value="100" min="10" max="1000" step="10" />
        <span class="unit">rows</span>
      </div>
      <div class="control-group">
        <label>
          <input type="checkbox" id="hideIdle" checked />
          Hide idle / GC
        </label>
      </div>
      <div class="control-group" id="viewToggleGroup">
        <label for="viewMode">View</label>
        <select id="viewMode">
          <option value="functions">Functions</option>
          <option value="packages">Packages</option>
          <option value="usercode">User Code</option>
        </select>
      </div>
      <div class="control-group" id="sourceFilterGroup">
        <label for="sourceFilter">Source</label>
        <select id="sourceFilter">
          <option value="all">All</option>
          <option value="user">User Code</option>
        </select>
      </div>
      <div class="control-group" id="diffGroup">
        <label>Diff</label>
        <select id="diffBase"></select>
        <span class="unit">vs</span>
        <select id="diffCompare"></select>
      </div>
      <div class="control-group" id="pkgSortByGroup">
        <label for="pkgSortBy">Sort by</label>
        <select id="pkgSortBy">
          <option value="selfMs">Self ms</option>
          <option value="delta">Diff</option>
        </select>
      </div>
    </section>

    <section class="table-wrap" id="tableWrap" hidden>
      <table id="profileTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </section>

    <div class="empty-state" id="emptyState" hidden>
      <p>No matching functions found.</p>
    </div>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
